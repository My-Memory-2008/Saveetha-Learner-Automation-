name: Run Web Agent Automation

on:
  workflow_dispatch: # Allows you to run it with a click of a button on the site
  schedule:
    - cron: '0 8 * * *' # Automated daily schedule ticker

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Configure Python Machine Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Runtime Library Dependencies
      run: |
        pip install playwright httpx
        playwright install chromium

    # FIXED STEP: Downloads the standalone binary directly from GitHub releases mirror
    - name: Download and Install Ollama Manually
      run: |
        echo "Downloading stable Ollama Linux standalone binary..."
        curl -L https://github.com -o ollama
        
        echo "Granting execution permissions to binary..."
        chmod +x ollama
        
        echo "Moving binary to system execution path..."
        sudo mv ollama /usr/local/bin/
        
        echo "Verifying installation..."
        ollama --version

    - name: Boot Ollama and Pull Qwen Vision Brain
      run: |
        echo "Starting Ollama server process safely..."
        nohup ollama serve > ollama.log 2>&1 &
        
        echo "Waiting for local network port 11434 to wake up..."
        for i in {1..15}; do
          if curl -s http://localhost:11434 > /dev/null; then
            echo "✅ Ollama is awake and responsive!"
            break
          fi
          echo "Waiting..."
          sleep 2
        done
        
        echo "Downloading Qwen Vision Model layers..."
        ollama pull qwen2.5vl:3b

    - name: Run Web AI Automation Agent Execution Script
      run: python run_agent.py

    - name: Securely Store Scraped Artifact Summaries
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: execution-results-bundle
        path: |
          dashboard_report.txt
          page_view.png

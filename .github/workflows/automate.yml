name: Run Web Agent Automation

on:
  workflow_dispatch: # Allows you to run it with a click of a button on the site
  
jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Configure Python Machine Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Runtime Library Dependencies
      run: |
        pip install playwright httpx
        playwright install chromium

    # ✅ FIXED STEP: Uses the official non-interactive Linux installation stream
    - name: Download and Install Ollama Automatically
      run: |
        echo "Installing Ollama via the official Linux automated script..."
        curl -fsSL https://ollama.com | sh
        
        echo "Verifying installation version..."
        ollama --version

    # ✅ FIXED STEP: Uses nohup to ensure the process isn't killed, and uses a retry block to wait for port 11434
    - name: Boot Ollama and Pull Qwen Vision Brain
      run: |
        echo "Starting Ollama background process..."
        nohup ollama serve > ollama.log 2>&1 &
        
        echo "Waiting for local network port 11434 to wake up..."
        for i in {1..15}; do
          if curl -s http://localhost:11434 > /dev/null; then
            echo "✅ Ollama server is awake and responding!"
            break
          fi
          echo "Waiting..."
          sleep 2
        done
        
        echo "Pulling Qwen Vision model layers..."
        ollama pull qwen2.5vl:3b

    - name: Run Web AI Automation Agent Execution Script
      run: python run_agent.py

    - name: Securely Store Scraped Artifact Summaries
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: execution-results-bundle
        path: |
          dashboard_report.txt
          page_view.png

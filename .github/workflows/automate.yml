name: Run Web Agent Automation

on:
  workflow_dispatch: # Allows you to run it with a click of a button on the site
  
jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Configure Python Machine Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Runtime Library Dependencies
      run: |
        pip install playwright httpx
        playwright install chromium

    - name: Boot Ollama and Pull Qwen Vision Brain
      run: |
        curl -fsSL https://ollama.com | sh
        ollama serve > ollama.log 2>&1 &
        sleep 7 
        ollama pull qwen2.5-vl:3b

    - name: Run Web AI Automation Agent Execution Script
      run: python run_agent.py

    - name: Securely Store Scraped Artifact Summaries
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: execution-results-bundle
        path: |
          dashboard_report.txt
          page_view.png

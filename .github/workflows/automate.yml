name: Run Web Agent Automation

on:
  workflow_dispatch: # Allows manual click triggering from the web panel
  
jobs:
  run-agent:
    runs-on: ubuntu-latest

    # ✅ FIXED: Runs Ollama as a native cloud Docker service
    # Bypasses system extraction permissions, folder blocks, and curl utility errors
    services:
      ollama-service:
        image: ollama/ollama:latest
        ports:
          - 11434:11434

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Configure Python Machine Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Runtime Library Dependencies
      run: |
        pip install playwright httpx
        playwright install chromium

    # ✅ FIXED STEP: Pings the active service and pulls the model cleanly via shell API commands
    # This leaves the download handling to Docker instead of system curl scripts
    name: Download Qwen Vision Model Layers
      run: |
        echo "Testing connection to active container service network..."
        curl -s http://localhost:11434
        
        echo "Pulling Qwen Vision model through container socket..."
        ollama pull qwen2.5vl:3b

    - name: Run Web AI Automation Agent Execution Script
      run: python run_agent.py

    - name: Securely Store Scraped Artifact Summaries
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: execution-results-bundle
        path: |
          dashboard_report.txt
          page_view.png

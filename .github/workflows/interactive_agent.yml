name: Execute Interactive Task Agent

on:
  workflow_dispatch: # Opens manual form triggering
    inputs:
      # ✅ INTERACTIVE FIELD: Gives you an input box on the GitHub site to paste any URL link
      target_url:
        description: 'Paste the destination page URL link here to execute automation'
        required: true
        default: 'https://saveetha.in'

permissions:
  contents: write
  actions: write

jobs:
  run-task:
    runs-on: ubuntu-latest

    services:
      ollama-service:
        image: ollama/ollama:latest
        ports:
          - 11434:11434

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Configure Python Machine Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Runtime Library Dependencies
      run: |
        pip install playwright httpx beautifulsoup4
        playwright install chromium

    - name: Verify Ollama Service and Pull Qwen Vision Model
      run: |
        curl -s http://localhost:11434
        curl -X POST http://localhost:11434/api/pull -d '{"name": "qwen2.5vl:3b", "stream": false}'

    - name: Execute 6-Hour Task Monitoring Loop
      env:
          PYTHONUNBUFFERED: "1" 
      # Passes the text input directly from your UI submission box down to the script process
      run: python interactive_task.py "${{ github.event.inputs.target_url }}"

name: Execute Interactive Task Agent

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Paste the destination page URL link here to execute automation'
        required: true
        default: 'https://saveetha.in'

# ✅ FIX: This forces overlapping workflows to wait in line for the code files to save 
# preventing data collisions or duplicate text file overrides completely
concurrency:
  group: sync-repository-state
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-task:
    runs-on: ubuntu-latest

    services:
      ollama-service:
        image: ollama/ollama:latest
        ports:
          - 11434:11434

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        persist-credentials: true
        fetch-depth: 0

    - name: Configure Python Machine Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Runtime Library Dependencies
      run: |
        pip install playwright httpx beautifulsoup4
        playwright install chromium

    - name: Verify Ollama Service and Pull Qwen Vision Model
      run: |
        curl -s http://localhost:11434
        curl -X POST http://localhost:11434/api/pull -d '{"name": "qwen2.5vl:3b", "stream": false}'

    - name: Execute Task and Immediate Memory Lock
      env:
          PYTHONUNBUFFERED: "1" 
      run: python interactive_task.py "${{ github.event.inputs.target_url }}"

    # ✅ FIXED STEP: Commits the updated tracking JSON file back to your repo root
    # Uses rebase and branch targeting to ensure parallel jobs push cleanly
    - name: Push Topic Lock to Repository Memory
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        
        # ✅ FIXED: Now tracks complete-interact.json files explicitly
        if [ -f complete-interact.json ]; then
          git add complete-interact.json
          if ! git diff-index --quiet HEAD; then
            git commit -m "🔒 Concurrency Lock: Claimed and Registered Discussion Node in complete-interact.json"
            git pull origin HEAD:${{ github.ref }} --rebase
            git push origin HEAD:${{ github.ref }}
            echo "✅ Thread reservation successfully logged in complete-interact.json!"
          fi
        fi
